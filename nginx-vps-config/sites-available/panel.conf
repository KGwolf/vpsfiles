# 3x-ui panel
# IMPORTANT: configure 3x-ui to listen on 127.0.0.1:2053.
# Cloudflare Access must be configured for panel.448910.xyz at Cloudflare.
# Do not expose the 3x-ui panel port to the public Internet.
server {
    listen 80;
    listen [::]:80;
    server_name panel.448910.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name panel.448910.xyz;

    include /etc/nginx/snippets/ssl-common.conf;

    location / {
        proxy_pass http://127.0.0.1:2053;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
