# Xray VLESS + WebSocket inbound
# Configure Xray to listen on 127.0.0.1:10000.
# The WebSocket path MUST exactly match the path configured in 3x-ui.
# Replace /REPLACE_WITH_RANDOM_PATH before enabling this site.
server {
    listen 80;
    listen [::]:80;
    server_name node.448910.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name node.448910.xyz;

    include /etc/nginx/snippets/ssl-common.conf;

    location = /REPLACE_WITH_RANDOM_PATH {
        proxy_pass http://127.0.0.1:10000;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location / {
        return 404;
    }
}
